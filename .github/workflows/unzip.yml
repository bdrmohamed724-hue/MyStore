name: Extract Store

on:
  push:
    paths:
      - 'MYSTORE.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MYSTORE.zip
        run: |
          unzip -o MYSTORE.zip -d .
          rm MYSTORE.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract MYSTORE project" || echo "Nothing to commit"
          git push
